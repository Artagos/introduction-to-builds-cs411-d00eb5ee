apiVersion: v1
kind: Pod
metadata:
  labels:
    run: myapp
  name: myapp
spec:
  containers:
  - image: ttl.sh/artagos:2h
    name: myapp
    resources:
      requests:
        memory: "256Mi"   # Minimum memory guaranteed to the container
        cpu: "250m"       # Minimum CPU guaranteed (0.25 cores)
      limits:
        memory: "512Mi"   # Maximum memory the container is allowed to consume
        cpu: "500m"       # Maximum CPU allowed (0.5 cores)
    
    # --- Added Probes Block ---
    livenessProbe:
      httpGet:
        path: /        # Adjust the path (e.g., /healthz) if your app expects a specific endpoint
        port: 4444
      initialDelaySeconds: 5  # Gives the container 5 seconds to start before checking
      periodSeconds: 10       # Checks every 10 seconds
      
    readinessProbe:
      httpGet:
        path: /        # Adjust the path (e.g., /ready) if your app expects a specific endpoint
        port: 4444
      initialDelaySeconds: 5
      periodSeconds: 10
    # --------------------------

  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}